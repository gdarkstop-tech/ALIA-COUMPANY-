name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap database roles (owner / app / auth)
        run: PSQL="psql -h localhost -U postgres" GHAYARLY_DATABASES=ghayarly_test bash scripts/db-bootstrap.sh
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit, API, migration, auth and RLS tests
        run: pnpm test
      - name: Verify native bundles compile (Android + iOS)
        run: pnpm --filter @ghayarly/mobile exec expo export --platform android --platform ios --output-dir ../../dist/native
        env:
          CI: '1'
      - name: Build admin console
        run: pnpm --filter @ghayarly/admin build
      - name: Store & release readiness checks (brand, metadata limits, icons, native config, no committed keys)
        run: pnpm release:check
      - name: Build public support / privacy / account-deletion site
        run: pnpm --filter @ghayarly/site build

  # Native compile of the Android release (AAB) with 16 KB page-size verification. Debug-signed:
  # the result is a compile/packaging check only — store builds are produced and signed by EAS.
  android-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Generate native project (production variant)
        run: pnpm --filter @ghayarly/mobile exec expo prebuild --platform android --clean --no-install
        env:
          APP_VARIANT: production
          EXPO_PUBLIC_API_URL: https://api.ci-check.invalid
      - name: Assemble release AAB
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon bundleRelease assembleRelease
        env:
          APP_VARIANT: production
          EXPO_PUBLIC_API_URL: https://api.ci-check.invalid
      - name: Verify targetSdk, permissions and 16 KB alignment
        run: bash scripts/release/verify-android.sh apps/mobile/android/app/build/outputs/apk/release/app-release.apk
